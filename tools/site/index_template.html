<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B3A8C">
<title>शास्त्र · Scriptures</title>
<style>
/*FONTS*/
:root{
  --bg:#F6F6F2; --surface:#FFFFFF; --ink:#1D1C1A; --muted:#6A6862; --rule:#E2E0DA;
  --indigo:#2B3A8C; --indigo-soft:#E7EAF6; --saffron:#C9741C; --saffron-soft:#FBEBD8;
  --note:#7A4B12; --note-bg:#FFF6E9; --ok:#2F7A4F;
  --verse-size:21px; --mean-size:16.5px;
  --dev:'NSDev','Noto Serif Devanagari','Nirmala UI','Mangal',serif;
  --lat:'Literata','TrLat','NSDev','Georgia',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131C; --surface:#181C2A; --ink:#ECE8DE; --muted:#9AA0B3; --rule:#2A3043;
    --indigo:#A9B6FF; --indigo-soft:#232A45; --saffron:#F2A653; --saffron-soft:#3A2B1A;
    --note:#F6C98B; --note-bg:#2A2216; --ok:#7FD3A2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131C; --surface:#181C2A; --ink:#ECE8DE; --muted:#9AA0B3; --rule:#2A3043;
  --indigo:#A9B6FF; --indigo-soft:#232A45; --saffron:#F2A653; --saffron-soft:#3A2B1A;
  --note:#F6C98B; --note-bg:#2A2216; --ok:#7FD3A2; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--dev);font-size:16px;line-height:1.6;min-height:100vh;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical;line-height:1.55}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.lat{font-family:var(--lat)}
.view{display:none;min-height:100vh}
.view.on{display:block}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---------- top bars ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:6px;min-height:56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;flex:none}
.ib:active{background:var(--indigo-soft)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--saffron)}
.bt{flex:1;min-width:0;line-height:1.25}
.bt .k{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt .t{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--lat);font-size:13px;color:var(--saffron);padding:2px 8px;border:1px solid var(--saffron);border-radius:20px;display:none}
.timer.on{display:inline-block}
/* ---------- home ---------- */
.hero{padding:34px 0 10px;text-align:center}
html,body{overflow-x:clip}
.hero h1{font-size:40px;line-height:1.15;margin:0;overflow-wrap:anywhere;color:var(--indigo);font-weight:700;letter-spacing:.5px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 2px;font-size:15px;color:var(--muted);font-weight:600}
.card .big{font-size:19px;font-weight:700}
.card .sub{font-size:14px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--indigo);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--indigo);border:1px solid var(--indigo)}
.btn.small{padding:6px 12px;font-size:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:4px;margin:18px 0 8px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:14.5px;color:var(--muted)}
.seg button.on{background:var(--indigo);color:var(--bg);font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--rule)}
.list .it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 2px}
.list .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--indigo-soft);color:var(--indigo);font-weight:700;font-size:15px;flex:none}
.list .no.done{background:var(--ok);color:var(--bg)}
.list .ti{font-size:17px;font-weight:600}
.list .ds{font-size:13.5px;color:var(--muted)}
.list .chev{color:var(--muted)}
.topics{padding:0 0 8px 46px}
.topics button{display:block;width:100%;text-align:left;padding:7px 0;font-size:15px;color:var(--ink);border-top:1px dashed var(--rule)}
.topics button span{color:var(--muted);font-size:13px;margin-left:6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 30px}
.quick button{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 4px;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick svg{width:22px;height:22px;stroke:var(--indigo);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- reader ---------- */
#rBody{padding-bottom:110px}
.sechead{margin:14px 0 2px;text-align:center;color:var(--muted);font-size:13.5px}
.topic-h{margin:20px 0 2px;text-align:center}
.topic-h b{display:inline-block;font-size:18px;color:var(--indigo);border-bottom:2px solid var(--saffron);padding:0 6px 2px}
.topic-h .lat{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.verse{padding:12px 0 8px;border-bottom:1px solid var(--rule);scroll-margin-top:72px}
.topic-h{scroll-margin-top:72px}
.verse.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--saffron-soft)}to{background:transparent}}
.vtype{font-size:12.5px;color:var(--saffron);font-weight:600;margin-right:2px}
.vtext{font-weight:700;font-size:var(--verse-size);line-height:1.6;text-align:center}
.vtext p{margin:0;position:relative}
.vtext{padding:0 30px;overflow-wrap:anywhere}
.vtext.vedic{font-family:'Vedic','NSDev',serif}
.btn[disabled]{opacity:.45;pointer-events:none}
.tgrp{display:inline-flex;align-items:stretch}.tgrp button+button{margin-left:-1px}.tgrp .tn{min-width:30px;padding:6px 0;font-size:16px;line-height:1}.tgrp .tn:first-child{border-radius:10px 0 0 10px}.tgrp .tn:first-child+button{border-radius:0}.tgrp .tn:first-child+button:last-child{border-radius:0 10px 10px 0}.tgrp button:not(.tn)+.tn{border-radius:0 10px 10px 0}
.tmark{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:8px 0 2px}.tmark button{border:1px solid var(--saffron);color:var(--saffron);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:700;background:var(--bg)}.tmark button:active{background:color-mix(in srgb,var(--saffron) 18%,transparent)}.tinfo{width:100%;text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}.tinfo .test{color:var(--saffron)}
body.timing .verse.tocheck{box-shadow:inset 3px 0 0 var(--saffron)}.tcheck{margin:10px 0}.tcheck summary{cursor:pointer;font-size:15px}.tlist{display:flex;flex-direction:column;max-height:50vh;overflow:auto;margin-top:6px}.tlist button{text-align:left;padding:9px 4px;border-bottom:1px solid var(--rule);font-size:15px}
.tbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}.tctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}.tctl b{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}   /* a long Sanskrit compound may break rather than run off a phone screen */
.half{display:inline-block}
.w{border-radius:4px;cursor:pointer}
.w:active,.w.sel{background:var(--saffron-soft)}
.tr .dd{font-family:'NSDev',var(--lat);font-style:normal;white-space:nowrap}
.tr{font-family:'TrLat','NSDev',var(--lat);font-style:italic;font-size:14px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.5}
.lyr{display:flex;border:1px solid var(--rule);border-radius:16px;overflow:hidden;flex:none}
.lyr button{padding:0 9px;min-height:32px;font-size:15px;color:var(--muted)}
.lyr button+button{border-left:1px solid var(--rule)}
.lyr button.on{background:var(--indigo-soft);color:var(--indigo);font-weight:700}.lyr .lrec svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round;display:block}
.vend{position:absolute;right:-25px;bottom:0;height:calc(var(--verse-size) * 1.6);display:flex;align-items:center;line-height:1}
.vsp{display:inline-block;width:64px}
.vno{white-space:nowrap}
.vtype{text-align:center;margin:18px auto 2px;color:var(--saffron);font-size:calc(var(--verse-size) * .8);font-weight:600;line-height:1.3;white-space:nowrap}.vt{position:absolute;left:-28px;top:0;height:calc(var(--verse-size) * 1.6);display:flex;align-items:center;font:inherit;font-size:12px;line-height:1;font-weight:600;color:var(--saffron);padding:0 2px}
.vb{width:19px;height:30px;display:inline-grid;place-items:center;color:var(--muted);opacity:.75}
.vb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.vb.bm-on{color:var(--saffron);opacity:1}
.vbm{width:26px;color:var(--indigo);opacity:.85}.vbm svg{width:20px;height:20px;stroke-width:2.2}   /* the bookmark sign larger and darker, easy to see (owner, 2026-10-20) */
.bmrow{display:flex;align-items:stretch;gap:6px}.bmrow .res{flex:1;min-width:0}.bmdel{flex:none;width:44px;display:grid;place-items:center;color:var(--muted);border-bottom:1px solid var(--rule)}.bmdel svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.vb.bm-on svg{fill:var(--saffron)}
.ratebox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 2px}.ratebox span{flex:1;min-width:60px}.ratebox button{border:1px solid var(--rule);border-radius:10px;padding:6px 10px;font-size:14px;color:var(--indigo);background:var(--bg)}.ratebox button.on{background:var(--indigo);color:var(--bg);border-color:var(--indigo)}
.menusw{margin-top:2px}.swic{width:20px;height:20px;stroke:var(--indigo);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-left:2px}
.chips{display:flex;align-items:center;gap:6px;margin-top:6px}
.chip{border:1px solid var(--rule);border-radius:20px;padding:1px 11px;font-size:13px;color:var(--muted);min-height:30px}
.chip.on{background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo);font-weight:700}
.chips .sp{flex:1}
.chips .ib{width:36px;height:36px}
.chips .ib svg{width:19px;height:19px}
.chips .ib.bm-on{color:var(--saffron)}
.chips .ib.bm-on svg{fill:var(--saffron)}
.layer{margin-top:6px;font-size:var(--mean-size);line-height:1.6;font-weight:400}
.layer.h{}
.layer.e{font-family:var(--lat);font-size:calc(var(--mean-size) - .5px)}
/* meanings sit under the centred verse: centred too, using the full width, with evenly balanced lines; a small ॰ separates
   verse and meaning; when Hindi and English are both shown, English is a quieter grey */
.verse > .layer.h,.verse > .layer.e{text-align:center;text-wrap:pretty}
.verse > :not(.layer) + .layer:not(.wl)::before{content:"॰";display:block;text-align:center;color:var(--saffron);font-size:18px;line-height:1;margin:2px 0 6px;font-family:var(--dev)}
.verse > .layer.h ~ .layer.e{color:var(--muted)}
/* …but where a verse carries grey commentary (footnotes), the English meaning stays in full ink so it is not mistaken for the commentary */
.verse:has(.fn) > .layer.h ~ .layer.e{color:inherit}
.layer .lbl{display:block;font-size:12px;color:var(--muted);font-family:var(--dev);margin-bottom:2px}
.layer .fn{font-size:13.5px;color:var(--muted);margin-top:6px}
.wb{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.wb .ww{font-weight:700;white-space:nowrap}
.wb .wm{color:var(--ink)}
.wb .wm .en{font-family:var(--lat);color:var(--muted);font-size:14px}
.wb .wm .q{color:var(--muted);font-size:12.5px}
.tag{font-size:11.5px;color:var(--saffron);border:1px solid var(--saffron);border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:middle}
.note{margin-top:10px;background:var(--note-bg);border-left:3px solid var(--saffron);border-radius:0 10px 10px 0;padding:8px 12px;color:var(--note);font-size:15.5px;line-height:1.6}
.note .who{font-size:12px;opacity:.8;display:flex;gap:8px;align-items:center}
.note .who button{margin-left:auto;font-size:12px;text-decoration:underline}
.pause{margin:22px 0;padding:14px;border:1.5px dashed var(--saffron);border-radius:16px;text-align:center;background:var(--saffron-soft)}
.pause b{display:block;font-size:17px;color:var(--saffron)}
.pause .sub{font-size:13px;color:var(--muted);margin:2px 0 10px}
.colo{margin:26px 0;text-align:center;color:var(--muted);font-size:14.5px}
.player{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:21;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.player .wrap{display:flex;align-items:center;gap:2px;min-height:56px}
.player .pmain{background:var(--indigo);color:#fff;border-radius:50%;width:44px;height:44px}
.player .pmain svg{stroke:#fff}
.player .pinfo{flex:1;min-width:0;text-align:left;padding:4px 8px}
.player .pinfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .pinfo small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:var(--rule)}.pbar span{display:block;height:3px;width:0;background:var(--saffron)}
body.playing #rBody{padding-bottom:150px}
/* the verse being recited: a tint that covers exactly the verse's own box (its padding gives the text room), widened sideways
   only, so its top edge never crosses the previous verse's rule; that rule is hidden while the next verse is lit */
.verse.now{border-bottom-color:transparent;background:color-mix(in srgb,var(--saffron) 8%,transparent);border-radius:12px;margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
.verse:has(+ .verse.now){border-bottom-color:transparent}
.vb.vplay{position:absolute;left:-32px;top:0;height:calc(var(--verse-size) * 1.6);color:var(--saffron);opacity:1}
.vb.vplay svg{fill:var(--saffron);stroke:none;width:34px;height:34px;margin-left:-4px}   /* as easy to see as the bookmark sign (owner, 2026-10-20) */.vb.vplay{width:30px}
.vbm{position:absolute;right:-25px;top:0;height:calc(var(--verse-size) * 1.6)}
.vtext p.one{padding:calc(var(--verse-size) * .8) 0}
.rowp{position:relative}
.heroacts{display:flex;flex-wrap:nowrap;justify-content:center;gap:8px;margin-top:14px}.heroacts .btn{white-space:nowrap;min-width:0;padding-left:16px;padding-right:16px}
.no.pg{background:transparent;border:1px solid var(--rule)}.no.pg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.heroacts:empty{display:none}.btn.cont{font-size:14.5px}.playall svg{width:16px;height:16px;fill:currentColor;stroke:none}
.list .lhead{font-size:13px;font-weight:700;color:var(--saffron);letter-spacing:.02em;padding:18px 2px 4px;border:0}
.ytno{width:200px;height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px;box-sizing:border-box;font-size:13px;text-align:center;background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:12px}.ytno .btn{display:block;padding:9px 8px;border-radius:10px;background:var(--accent,#2b3990);color:#fff;text-decoration:none;font-size:13px}
.rowp .lplay ~ .it .grow{padding-right:46px}.lworks{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px 14px;margin-top:-4px}.lworks button{padding:7px 13px;border:1px solid color-mix(in srgb,var(--indigo) 30%,var(--rule));border-radius:999px;font-size:15px;color:var(--indigo);background:var(--surface);font-weight:600;text-align:left}.lworks button.more{color:var(--muted);font-weight:400}
.lplay{position:absolute;right:30px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;z-index:2}
.lplay svg{width:16px;height:16px;fill:var(--indigo);stroke:none}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.navbar .wrap{display:flex;align-items:center;gap:8px;min-height:60px}
.navbar .mid{flex:1;text-align:center;font-weight:700;font-size:15px;padding:8px;border-radius:12px}
.navbar .mid small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{padding:10px 14px;border-radius:12px;font-size:15px;color:var(--indigo);font-weight:600}
.navbtn:disabled{opacity:.3}
body.recite .chips,body.recite .layer,body.recite .note,body.recite .tr{display:none!important}
body.recite .vtext{font-size:calc(var(--verse-size) + 5px)}
/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
.scrim.on{display:block}
.coach{position:fixed;inset:0;z-index:58;pointer-events:none}.coach[hidden]{display:none}.cspot{position:fixed;border-radius:14px;box-shadow:0 0 0 3px var(--saffron),0 0 0 9999px rgba(20,22,40,.55);transition:all .25s ease;pointer-events:none}.cbub{position:fixed;left:16px;right:16px;max-width:440px;margin:0 auto;background:var(--surface);border-radius:16px;padding:14px 16px 10px;box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:auto}.cbub p{margin:0 0 8px;font-size:17px;line-height:1.5}.cbrow{display:flex;justify-content:space-between;align-items:center;font-size:13px}.cbrow button{color:var(--indigo);font-size:14px;padding:6px 4px}.tour{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 70%,#000 30%);display:flex;align-items:center;justify-content:center;padding:16px}.tour[hidden]{display:none}
.tcard{background:var(--surface);border-radius:22px;max-width:420px;width:100%;padding:22px 20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
.tcard h2{margin:14px 0 6px;font-size:21px}.tcard p{margin:0 0 14px;color:var(--muted);font-size:16px;line-height:1.5}
.tart{height:150px;border-radius:16px;background:var(--indigo-soft);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;overflow:hidden}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.tdots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}.tdots i.on{background:var(--indigo);width:18px;border-radius:4px}
.tbtns{display:flex;gap:10px;justify-content:space-between}.tbtns .btn{flex:1}
.ta-om{width:72px;height:72px;border-radius:18px;background:#2B3A8C;color:#F2A653;font:700 44px/72px 'Noto Serif Devanagari',serif}
.ta-line{display:flex;gap:8px;align-items:center}.ta-bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ta-word{padding:3px 10px;border-radius:8px;background:var(--saffron-soft);color:var(--saffron);font-weight:700;font-family:'Noto Serif Devanagari',serif;font-size:18px;border-bottom:2px solid var(--saffron)}
.ta-pop{background:var(--surface);border-radius:12px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:14px;text-align:left}
.ta-pill{display:flex;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:var(--surface)}.ta-pill span{padding:6px 14px;font-weight:700;color:var(--muted)}.ta-pill span.on{background:var(--indigo-soft);color:var(--indigo)}
