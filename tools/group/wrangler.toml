# The group paath relay (tools/group/README.md). Deploy: npx wrangler deploy (from this folder).
name = "scriptures-group"
main = "worker.js"
compatibility_date = "2025-10-01"

# only the library's own pages may connect (the Android app shows the same site); localhost for testing
[vars]
ORIGINS = "https://scriptures.craadle.org,http://localhost:8000"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session"]
