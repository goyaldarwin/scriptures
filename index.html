<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B3A8C">
<title>शास्त्र · Scriptures</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="app/icon.svg"><link rel="apple-touch-icon" href="app/apple-touch-icon.png"><link rel="stylesheet" href="app/fonts.css?v=6ce0da9346"><link rel="stylesheet" href="app/style.css?v=acb7ec16a6">

</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
 <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 5v14M18 6l-8 6 8 6z" fill="currentColor"/></symbol>
 <symbol id="i-next" viewBox="0 0 24 24"><path d="M17 5v14M6 6l8 6-8 6z" fill="currentColor"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="2.1" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-bm" viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></symbol>
 <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4"/><path d="M8.5 9h7M8.5 12.5h5"/></symbol>
 <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
 <symbol id="i-set" viewBox="0 0 24 24"><path d="M10.8 4.5 L11.0 1.9 L13.0 1.9 L13.2 4.5 L13.5 4.5 L16.2 5.7 L16.4 5.8 L18.5 4.1 L19.9 5.5 L18.2 7.6 L18.3 7.8 L19.5 10.5 L19.5 10.8 L22.1 11.0 L22.1 13.0 L19.5 13.2 L19.5 13.5 L18.3 16.2 L18.2 16.4 L19.9 18.5 L18.5 19.9 L16.4 18.2 L16.2 18.3 L13.5 19.5 L13.2 19.5 L13.0 22.1 L11.0 22.1 L10.8 19.5 L10.5 19.5 L7.8 18.3 L7.6 18.2 L5.5 19.9 L4.1 18.5 L5.8 16.4 L5.7 16.2 L4.5 13.5 L4.5 13.2 L1.9 13.0 L1.9 11.0 L4.5 10.8 L4.5 10.5 L5.7 7.8 L5.8 7.6 L4.1 5.5 L5.5 4.1 L7.6 5.8 L7.8 5.7 L10.5 4.5 Z"/><circle cx="12" cy="12" r="3"/></symbol>
 <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
 <symbol id="i-lamp" viewBox="0 0 24 24"><path d="M12 3c2 3 3 4.5 3 6.5a3 3 0 0 1-6 0C9 7.5 10 6 12 3z"/><path d="M5 15h14l-2 5H7z"/></symbol>
 <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
 <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
 <symbol id="i-jump" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
 <symbol id="i-recite" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></symbol>
 <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-tour" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><circle cx="12" cy="16.8" r=".6"/></symbol>
 <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></symbol>
</svg>

<!-- LIBRARY -->
<section id="library" class="view on">
 <div class="bar"><div class="wrap">
  <nav class="crumbrow" id="libCrumbs"></nav>
  <div class="sz"><button class="szm" aria-label="छोटा अक्षर">A<sup>−</sup></button><button class="szp" aria-label="बड़ा अक्षर">A<sup>+</sup></button></div>
  <div class="lyr uilang"><button data-u="hi">हिं</button><button data-u="en" class="lat">En</button></div>
  <button class="ib hsearch" id="libSearchBtn" aria-label="खोजें"><svg><use href="#i-search"/></svg></button>
  <button class="ib hmenu" id="libMenu" aria-label="मेनू"><svg><use href="#i-menu"/></svg></button>
 </div></div>
 <div class="wrap zoomable">
  <div class="hero"><h1 id="libTitle" data-en="Library">पुस्तकालय</h1></div>
  <ul class="list" id="libList"></ul>
  <div style="height:40px"></div>
 </div>
</section>

<!-- HOME (one work) -->
<section id="home" class="view">
 <div class="bar"><div class="wrap">
  <button class="libbtn hback" id="hLib"><svg><use href="#i-back"/></svg><span data-en="Library">पुस्तकालय</span></button>
  <span class="grow"></span>
  <div class="sz"><button class="szm" aria-label="छोटा अक्षर">A<sup>−</sup></button><button class="szp" aria-label="बड़ा अक्षर">A<sup>+</sup></button></div>
  <div class="lyr uilang"><button data-u="hi">हिं</button><button data-u="en" class="lat">En</button></div>
  <button class="ib hsearch" id="hSearch" aria-label="खोजें"><svg><use href="#i-search"/></svg></button>
  <button class="ib hmenu" id="hMenu" aria-label="मेनू"><svg><use href="#i-menu"/></svg></button>
 </div></div>
 <div class="wrap zoomable">
  <div class="hero"><h1 id="hTitle"></h1><p id="hSub"></p><div class="heroacts"><span id="contCard"></span><button class="btn playall" id="hPlayAll" hidden><svg><use href="#i-play"/></svg><span data-en="Play all">सम्पूर्ण पाठ सुनें</span></button></div></div>
  <div class="seg" id="orgSeg"></div>
  <ul class="list" id="orgList"></ul>
  <div style="height:40px"></div>
 </div>
</section>

<!-- READER -->
<section id="reader" class="view">
 <div class="bar"><div class="wrap">
  <button class="ib hback" id="rBack" aria-label="वापस"><svg><use href="#i-back"/></svg></button>
  <span class="grow"></span>
  <button class="pill" id="rRecite" hidden style="padding:6px 10px;font-size:13px"><span data-en="Recitation mode">पाठ मोड</span> ✕</button>
  <div class="sz"><button class="szm" id="rSmaller" aria-label="छोटा अक्षर">A<sup>−</sup></button><button class="szp" id="rBigger" aria-label="बड़ा अक्षर">A<sup>+</sup></button></div>
  <div class="lyr layers" id="rLayers"><button data-l="h">हिं</button><button data-l="e" class="lat">En</button><button data-l="w">शब्द</button><button data-l="r" class="lrec" aria-label="पाठ मोड · Recitation mode" title="Recitation mode"><svg><use href="#i-recite"/></svg></button></div>
  <button class="ib hsearch" id="rSearch" aria-label="खोजें"><svg><use href="#i-search"/></svg></button>
  <button class="ib hmenu" id="rMore" aria-label="मेनू"><svg><use href="#i-menu"/></svg></button>
 </div></div>
 <div class="wrap" id="rBody"></div>
 <div class="navbar"><div class="wrap">
  <button class="mid" id="rMid"></button>
 </div></div>
</section>

<button id="pJump" class="pjump" hidden></button>
<div id="player" class="player" hidden><div class="pbar"><span id="pProg"></span></div><div class="wrap pwrap">
  <div class="ytw"><div id="ytBox"></div></div>
  <div class="pside">
   <div class="ptop"><button class="pstep" id="pStep" hidden aria-label="step">±0.5 s</button><button class="ib" id="pClose" aria-label="stop"><svg><use href="#i-x"/></svg></button></div>
   <button class="pinfo" id="pInfo"><b id="pVerse"></b><small id="pTrack" class="lat"></small></button>
   <div class="pctl">
    <button class="ib" id="pPrev" aria-label="previous verse"><svg><use href="#i-prev"/></svg></button>
    <button class="ib pmain" id="pPlay" aria-label="play/pause"><svg><use href="#i-pause"/></svg></button>
    <button class="ib" id="pNext" aria-label="next verse"><svg><use href="#i-next"/></svg></button>
    <button class="prate" id="pRate" aria-label="speed">1×</button>
   </div>
  </div>
</div></div>
<!-- SEARCH -->
<section id="search" class="view">
 <div class="bar"><div class="wrap">
  <button class="ib" data-back aria-label="वापस"><svg><use href="#i-back"/></svg></button>
  <input id="q" type="search" placeholder="शब्द, अर्थ या English में खोजें" data-en-ph="Search a word, meaning or English" autocomplete="off" style="flex:1">
 </div></div>
 <div class="wrap">
  <div class="scope" id="scope">
   <button class="chip on" data-s="v" data-en="Verses">मूल पाठ</button><button class="chip on" data-s="h" data-en="Hindi meaning">हिंदी अर्थ</button><button class="chip on" data-s="e" data-en="English meaning">अंग्रेज़ी अर्थ</button><button class="chip on" data-s="pa" data-en="Punjabi meaning" hidden>पंजाबी अर्थ</button><button class="chip on" data-s="n" data-en="My notes">मेरी टिप्पणियाँ</button>
  </div>
  <div id="sRes"><div class="empty" data-en="Type any word from a verse, its Hindi meaning or its English meaning.">चौपाई, दोहे या अर्थका कोई भी शब्द लिखें।</div></div>
 </div>
</section>

<!-- BOOKMARKS -->
<section id="bookmarks" class="view">
 <div class="bar"><div class="wrap"><button class="ib" data-back aria-label="वापस"><svg><use href="#i-back"/></svg></button><div class="bt"><div class="t" data-en="Bookmarks &amp; notes">बुकमार्क और टिप्पणियाँ</div></div><div class="sz"><button class="szm" aria-label="छोटा अक्षर">A<sup>−</sup></button><button class="szp" aria-label="बड़ा अक्षर">A<sup>+</sup></button></div><div class="lyr uilang"><button data-u="hi">हिं</button><button data-u="en" class="lat">En</button></div></div></div>
 <div class="wrap zoomable" id="bmBody"></div>
</section>

<!-- SETTINGS -->
<section id="settings" class="view page">
 <div class="bar"><div class="wrap"><button class="ib" data-back aria-label="वापस"><svg><use href="#i-back"/></svg></button><div class="bt"><div class="t" data-en="More">और</div></div><div class="sz"><button class="szm" aria-label="छोटा अक्षर">A<sup>−</sup></button><button class="szp" aria-label="बड़ा अक्षर">A<sup>+</sup></button></div><div class="lyr uilang"><button data-u="hi">हिं</button><button data-u="en" class="lat">En</button></div></div></div>
 <div class="wrap zoomable" id="setBody"></div>
</section>

<!-- VIDHI -->
<section id="vidhi" class="view vidhi">
 <div class="bar"><div class="wrap"><button class="ib" data-back aria-label="वापस"><svg><use href="#i-back"/></svg></button><div class="bt"><div class="t" data-en="Pārāyaṇa vidhi">पारायण-विधि</div></div><div class="sz"><button class="szm" aria-label="छोटा अक्षर">A<sup>−</sup></button><button class="szp" aria-label="बड़ा अक्षर">A<sup>+</sup></button></div><div class="lyr" id="vidLang"><button data-l="h">हिं</button><button data-l="e" class="lat">En</button></div></div></div>
 <div class="wrap">
  <div class="seg" id="vidSeg"><button data-v="v" class="on" data-en="Pārāyaṇa vidhi">पारायण-विधि</button><button data-v="aarti" data-en="Āratī">आरती</button><button data-v="visarjan" data-en="Visarjana" hidden>विसर्जन</button></div>
  <div id="vidBody" class="zoomable" style="padding-bottom:40px"></div>
 </div>
</section>

<div class="loading" id="loading"></div>
<div class="scrim" id="scrim"></div>
<div class="coach" id="coach" hidden><div class="cspot" id="cspot"></div><div class="cbub" id="cbub"><p id="cbText"></p><div class="cbrow"><button id="cbBack" hidden><span data-en="‹ Back">‹ पीछे</span></button><span id="cbStep" class="muted"></span><button id="cbSkip"><span data-en="Skip tour">परिचय छोड़ें</span></button></div></div></div>
<div class="tour" id="tour" hidden role="dialog" aria-modal="true"><div class="tcard"><div class="tart" id="tourArt"></div><h2 id="tourT"></h2><p id="tourP"></p><div class="tdots" id="tourDots"></div><div class="tbtns"><button class="btn ghost" id="tourSkip"></button><button class="btn" id="tourNext"></button></div></div></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none">

<script src="app/app.js?v=7371153d84"></script>
</body>
</html>
