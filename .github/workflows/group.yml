# Deploys the group paath relay (tools/group/, a Cloudflare Worker) with the owner's Cloudflare token: by hand (Actions ›
# group › Run workflow), and again whenever tools/group/ changes on main. Steps and secrets: tools/group/README.md.
name: group
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/group/worker.js', 'tools/group/wrangler.toml', '.github/workflows/group.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - name: Deploy
        working-directory: tools/group
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::notice::No Cloudflare secrets yet (tools/group/README.md): nothing deployed"; exit 0; fi
          npx --yes wrangler@4 deploy
