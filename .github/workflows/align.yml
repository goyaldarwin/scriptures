# Time verses with Meta's MMS forced aligner (tools/audio/METHOD.md, steps 2–3) on GitHub's machines, one job per recording,
# in parallel; free here, because this repository is public. Started by hand only (Actions tab, or:
#   gh api repos/goyaldarwin/scriptures/actions/workflows/align.yml/dispatches -X POST -f ref=main
#     -f inputs[source]=tools/works/<work>/audio/<source id> -f inputs[ids]=<id,id,…> -f inputs[ref]=<branch>).
# First make <source>/mms/windows.json (tools/audio/mms_windows.py) on the branch `ref`.
# The recordings stay private, as in transcribe.yml: each job fetches only its own speech-quality copy from
# goyaldarwin/scriptures-data with the read-only token in DATA_TOKEN, onto its own throwaway machine; the audio is never
# committed, uploaded or printed. Only the result is kept: <source>/mms/<video id>.json, committed to `ref` (also when a job
# runs out of time, so a second run goes on from there). The scripts come from the branch the workflow is run from (`-f ref=`,
# main unless a pull request's scripts are being tried); the recordings from scriptures-data's `data_ref` (its default branch
# unless given). At most 256 jobs per run; `per_job` recordings share one job (many short recordings: kirtan), so a run
# holds up to 256 × per_job ids and the machines' setup is paid once per job.
name: align
on:
  workflow_dispatch:
    inputs:
      source:
        description: "audio source folder, e.g. tools/works/bhagavata-purana/audio/sanskrit-parayan"
        required: true
      ids:
        description: "comma-separated YouTube video ids to align (at most 256)"
        required: true
      ref:
        description: "branch that holds the audio source folder and its mms/windows.json; the results are committed to it"
        default: main
      data_ref:
        description: "branch of scriptures-data that holds the recordings (empty: its default branch)"
        default: ""
      per_job:
        description: "recordings aligned one after another in each job"
        default: "1"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - id: m
        run: python3 -c "import json,os; ids=[x.strip() for x in os.environ['IDS'].split(',') if x.strip()]; n=max(1,int(os.environ['PER'])); g=[' '.join(ids[k:k+n]) for k in range(0,len(ids),n)]; assert 0 < len(g) <= 256, len(g); print('ids='+json.dumps(g))" >> "$GITHUB_OUTPUT"
        env:
          IDS: ${{ inputs.ids }}
          PER: ${{ inputs.per_job }}
  align:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # at most 14 at once, so the checks, the site's publishing and the owner's timing submissions are not queued behind it
      max-parallel: 14
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: pub
          sparse-checkout: tools/audio
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: src
          sparse-checkout: ${{ inputs.source }}
      - name: the recordings' paths in scriptures-data
        id: rec
        env:
          SRC: src/${{ inputs.source }}
          VIDS: ${{ matrix.id }}
        run: |
          python3 -c "
          import json,os
          R={x['yt']:x for x in json.load(open(os.environ['SRC']+'/recordings.json'))}
          v=os.environ['VIDS'].split(); assert all(i in R and R[i].get('data') for i in v), 'no data path for ' + str([i for i in v if i not in R])
          print('data<<EOF'); print('\n'.join(R[i]['data'] for i in v)); print('EOF')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: goyaldarwin/scriptures-data
          ref: ${{ inputs.data_ref }}
          token: ${{ secrets.DATA_TOKEN }}
          path: data
          filter: blob:none
          sparse-checkout: ${{ steps.rec.outputs.data }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: ffmpeg (a static build from GitHub; apt only if that fails)
        run: |
          if curl -fsSL --retry 3 -m 300 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C "$RUNNER_TEMP"; then
            echo "$(ls -d "$RUNNER_TEMP"/ffmpeg-*/bin)" >> "$GITHUB_PATH"; exit 0; fi
          for i in 1 2 3; do sudo timeout 240 apt-get update -qq && sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg && exit 0; sleep 5; done; exit 1
      - run: pip install -q "torch==2.8.*" "torchaudio==2.8.*" numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: MMS's weights (Meta's file; else the same file from its copy on Hugging Face, checked by its SHA-256)
        # torchaudio's MMS_FA downloads model.pt from dl.fbaipublicfiles.com; while that host's certificate is expired the
        # download fails, so the same file is taken from a copy and accepted only if its SHA-256 is the one pinned here
        # (the file whose alignments equal those made with Meta's download: tools/audio/METHOD.md, "Where it runs")
        env:
          PIN: 20ef12963ab4924bef49ac4fc7f58ad5da2ee43b2c11bc8c853c9b90ecdbc680
        run: |
          d="$HOME/.cache/torch/hub/checkpoints"; mkdir -p "$d"; f="$d/model.pt"
          curl -fsSL --retry 3 -m 900 -o "$f" https://dl.fbaipublicfiles.com/mms/torchaudio/ctc_alignment_mling_uroman/model.pt \
            || curl -fsSL --retry 3 -m 900 -o "$f" https://huggingface.co/seanghay/khmer-forced-aligner/resolve/main/ctc_alignment_mling_uroman_model.pt
          s=$(sha256sum "$f" | cut -d' ' -f1); echo "model.pt sha256 $s"
          if [ -n "$PIN" ] && [ "$s" != "$PIN" ]; then echo "::error::model.pt is not the pinned file"; exit 1; fi
      - name: align ${{ matrix.id }}
        # stop a little before the job's limit, so what is done is still committed
        timeout-minutes: 335
        env:
          DATA_DIR: ${{ github.workspace }}/data
          THREADS: "4"
          VIDS: ${{ matrix.id }}
        run: for v in $VIDS; do ONLY=$v python3 pub/tools/audio/mms_align.py "src/${{ inputs.source }}" || exit 1; done
      - name: commit the result to ${{ inputs.ref }}
        if: always()
        run: |
          rm -rf data
          cd src && git config user.name "align workflow" && git config user.email "actions@users.noreply.github.com"
          for v in ${{ matrix.id }}; do [ -f "${{ inputs.source }}/mms/$v.json" ] && git add "${{ inputs.source }}/mms/$v.json"; done
          git commit -q -m "MMS starts ${{ matrix.id }} (${{ inputs.source }})" || exit 0
          for i in $(seq 1 15); do git pull -q --rebase origin "${{ inputs.ref }}" && git push -q origin "HEAD:${{ inputs.ref }}" && exit 0; sleep $((RANDOM % 40 + 5)); done; exit 1
