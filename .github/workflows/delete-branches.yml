# Deletes the branches named in the input (separated by spaces), so old branches can go without a clone:
# Actions → "delete branches" → Run workflow. main can never be deleted.
name: delete branches
on:
  workflow_dispatch:
    inputs:
      branches:
        description: 'Branches to delete, separated by spaces'
        required: true
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: delete
        env:
          BRANCHES: ${{ inputs.branches }}
        run: |
          for b in $BRANCHES; do
            if [ "$b" = main ]; then echo "keeping main"; continue; fi
            git push origin --delete "$b" && echo "deleted $b" || echo "not deleted: $b"
          done
