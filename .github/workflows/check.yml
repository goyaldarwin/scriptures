# Every pull request and every push to main: the library must pass its checks, the committed website must be
# exactly what the build makes from it, library/ must be exactly what tools/works/export.py and the timings make, no id that readers'
# data points at may disappear, and every work must open in a real browser without script errors.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM: /usr/bin/google-chrome   # the runner's own Chrome: no browser download, no apt-get
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/check.yml
      - name: the browser test driver (the build itself needs nothing beyond Python)
        timeout-minutes: 5
        run: pip install -q playwright==1.64.1 && "$CHROMIUM" --version
      - name: library checks + build
        run: python tools/site/build.py
      - name: the committed website matches the build
        run: |
          git status --porcelain -- index.html app sw.js manifest.json library > /tmp/diff.txt
          if [ -s /tmp/diff.txt ]; then echo "These generated files differ from what the build makes — run tools/site/build.py and commit:"; cat /tmp/diff.txt; git diff --stat; exit 1; fi
      - name: library/ is exactly what the generators make
        run: |
          python tools/site/regen_check.py 2>&1 | tee /tmp/regen.txt; rc=${PIPESTATUS[0]}
          grep -E '^FAIL|^ ' /tmp/regen.txt | head -20 | sed 's/^/::error::/'; exit $rc
      - name: no work or verse id that readers' bookmarks, notes and audio times point at has disappeared
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git fetch -q --depth=1 origin "$base" 2>/dev/null; then python tools/site/history_check.py "$base"; else echo "no earlier commit to compare with"; fi
      - name: smoke test (every work opens in a browser)
        run: python tools/site/smoke_test.py
      - name: navigation and reading experience (every work, phone size)
        # every failed check becomes an annotation, readable through the API (the raw log is not reachable from a Claude session)
        run: |
          python tools/site/ux_test.py 2>&1 | tee /tmp/ux.txt; rc=${PIPESTATUS[0]}
          grep -E '^FAIL|Error|error' /tmp/ux.txt | head -20 | sed 's/^/::error::/'; tail -n 3 /tmp/ux.txt | sed 's/^/::notice::/'; exit $rc
